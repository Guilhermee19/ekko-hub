[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ekko-core = { path = "crates/ekko-core" }
ekko-os = { path = "crates/ekko-os" }
ekko-integrations = { path = "crates/ekko-integrations" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
