# Builds the NSIS installer on a clean Windows runner (no Smart App Control there).
name: build-windows

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ekko-windows-installer
          path: target/release/bundle/nsis/*.exe
